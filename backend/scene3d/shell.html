<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>户型三维 · 可旋转</title>
<style>
  :root { --line: rgba(0,0,0,.10); --gold:#c9a96e; }
  * { -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#eef0f3;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; color:#1c1c1e; }
  #app { position:fixed; inset:0; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  /* 空间名：只留 5 枚小胶囊，可点进房间；不再铺满整张户型图。 */
  .room { position:absolute; transform:translate(-50%,-50%); text-align:center; white-space:nowrap;
    background:rgba(253,250,244,.84); border:1px solid rgba(84,62,38,.14); border-radius:999px;
    padding:2px 9px; box-shadow:0 2px 8px rgba(46,32,18,.10); backdrop-filter:blur(8px);
    pointer-events:auto; cursor:pointer; transition:opacity .18s,border-color .18s,background .18s; }
  .room:hover { border-color:var(--gold); background:#fffdf8; }
  .room b { display:block; font-size:10px; font-weight:600; letter-spacing:.3px; line-height:1.35; color:#57452f; }
  .room span { display:none; font-size:8.5px; color:#6b6b70; line-height:1.2; }
  .room em { display:none; font-size:8px; color:var(--gold); font-style:normal; }
  .room.lab-hide { visibility:hidden; opacity:0; pointer-events:none; }
  /* 家具悬停：名称 + 尺寸；桌面端跟着指针，触屏点一下也能看 */
  #ftip { position:fixed; left:0; top:0; z-index:12; display:none; pointer-events:none;
    max-width:210px; padding:6px 10px; border-radius:10px; white-space:nowrap;
    background:rgba(38,29,19,.90); color:#fff; font-size:11px; line-height:1.45;
    box-shadow:0 6px 20px rgba(0,0,0,.22); transform:translate(12px,14px); }
  #ftip b { font-weight:600; letter-spacing:.2px; }
  #ftip i { display:inline-block; width:6px; height:6px; margin-right:5px; border-radius:50%;
    background:var(--gold); vertical-align:middle; font-style:normal; }
  #ftip.show { display:block; }
  /* 灯位详情卡：点一盏灯摊开 §7.5/§7.6 四组字段（回路／开孔／SKU／驱动）＋缺件清单 */
  #lampCard { position:fixed; z-index:26; display:none; width:min(336px,calc(100% - 24px));
    max-height:min(54vh,430px); overflow:auto; padding:10px 12px 11px; border-radius:12px;
    background:rgba(28,24,19,.93); color:#f4efe6; border:1px solid rgba(201,169,110,.35);
    box-shadow:0 10px 30px rgba(0,0,0,.3); backdrop-filter:blur(10px); font-size:11.5px; line-height:1.55; }
  #lampCard.show { display:block; }
  #lampCard h5 { margin:0 0 2px; padding-right:22px; font-size:12.5px; font-weight:600; }
  #lampCard .lc-sub { color:#bdb3a3; font-size:10.5px; margin-bottom:6px; }
  #lampCard .lc-grp { margin:9px 0 2px; font-size:10px; font-weight:600; letter-spacing:.4px; color:#c9a96e; }
  #lampCard .lc-row { display:flex; gap:8px; padding:1px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  #lampCard .lc-k { flex:0 0 106px; color:#bdb3a3; }
  #lampCard .lc-v { flex:1 1 auto; word-break:break-word; }
  #lampCard .lc-miss { margin:7px 0; padding:7px 9px; border-radius:9px;
    background:rgba(214,86,66,.16); border:1px solid rgba(214,86,66,.4); color:#ffd9d2; font-size:11px; }
  #lampCard .lc-miss ul { margin:2px 0 0; padding-left:15px; }
  #lampCard .lc-foot { margin-top:7px; font-size:10.5px; color:#bdb3a3; }
  #lampCard .lc-x { position:absolute; right:7px; top:6px; width:21px; height:21px; border:0;
    border-radius:50%; background:rgba(255,255,255,.12); color:#f4efe6; font:14px/1 sans-serif; cursor:pointer; }
  /* 场景概览压成一条：空间数/面积/灯数一行读完，不再三行压在户型左上角。 */
  #hud { position:fixed; left:16px; top:16px; max-width:min(470px, calc(100% - 130px));
    display:flex; flex-wrap:wrap; align-items:center; gap:4px 9px;
    padding:7px 11px; border-radius:12px;
    background:rgba(255,255,255,.86); border:1px solid var(--line); box-shadow:0 4px 18px rgba(0,0,0,.06);
    font-size:11.5px; line-height:1.45; backdrop-filter:blur(10px); }
  #hud b { font-size:12px; white-space:nowrap; }
  #hud .gl-stats { color:#6b6b70; }
  #hud .gl-mode { display:inline-flex; align-items:center; gap:4px; padding:2px 9px;
    min-height:24px; border-radius:999px; border:1px solid var(--line); background:#fff; color:#574f44;
    font:inherit; font-size:11px; cursor:pointer; white-space:nowrap; }
  #hud .gl-mode:hover { border-color:var(--gold); }
  #hud .gl-mode.on { background:var(--gold); border-color:var(--gold); color:#fff; }
  /* 视角/图层默认收起：先让户型占满画面，点右上「视角 / 图层」再展开。 */
  #panel { position:fixed; right:16px; top:16px; width:196px; max-height:calc(100% - 32px); overflow:auto;
    padding:12px 13px; border-radius:14px; display:none;
    background:rgba(255,255,255,.9); border:1px solid var(--line); box-shadow:0 6px 24px rgba(0,0,0,.08);
    backdrop-filter:blur(12px); }
  #panel.gl-open { display:block; }
  /* 面板打开时收起「视角/图层」按钮，别压住面板的 × */
  body:has(#panel.gl-open) #glTools { display:none!important; }
  #panel h4 { margin:0 0 8px; padding-right:22px; font-size:12px; font-weight:600; color:#6b6b70; letter-spacing:.4px; }
  #glClose { position:sticky; top:0; float:right; z-index:2; width:24px; height:24px; margin:-5px -6px 0 0;
    display:flex; align-items:center; justify-content:center; padding:0; border:0; border-radius:50%;
    background:transparent; color:#8a8a8f; font:16px/1 -apple-system, sans-serif; cursor:pointer; }
  #glClose:hover { background:rgba(0,0,0,.05); color:#332b1e; }
  #panel .note { font-size:11px; color:#8a8a8f; margin:-4px 0 6px; }
  #circuits { max-height:26vh; overflow:auto; margin-bottom:8px; }
  #circuits .cir { display:flex; align-items:center; gap:6px; font-size:12px; padding:5px 7px; border-radius:8px;
    border:1px solid var(--line); margin-bottom:4px; cursor:pointer; background:#fff; }
  #circuits .cir.on { border-color:var(--gold); background:#fdf7ec; }
  #circuits .cir i { width:8px; height:8px; border-radius:50%; background:var(--gold); display:inline-block; opacity:.2 }
  #circuits .cir b { margin-left:auto; font-weight:600; color:#6b6b70 }
  .tipbox { position:fixed; right:16px; top:calc(50% + 40px); max-width:240px; font-size:12px;
    background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:10px; padding:8px 11px;
    box-shadow:0 6px 24px rgba(0,0,0,.08); display:none }
  .tipbox:not(:empty) { display:block }
  #panel .row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  #panel button, #panel .btns button { font:inherit; font-size:12px; padding:6px 10px; border-radius:9px;
    border:1px solid var(--line); background:#fff; color:#1c1c1e; cursor:pointer; transition:.15s; }
  #panel button:hover { border-color:var(--gold); }
  #panel button.on { background:var(--gold); border-color:var(--gold); color:#fff; }
  #cut { width:100%; accent-color:var(--gold); }
  .cutline { display:flex; justify-content:space-between; font-size:11px; color:#6b6b70; margin-bottom:4px; }
  #fixtures { position:fixed; right:16px; bottom:16px; width:230px; max-height:34vh; overflow:auto;
    font-size:11px; line-height:1.75; color:#3c3c40; background:rgba(255,255,255,.9);
    border:1px solid var(--line); border-radius:12px; padding:9px 11px; box-shadow:0 4px 18px rgba(0,0,0,.06); }
  #fixtures .fx { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #fixtures .fx i { display:inline-block; width:7px; height:7px; background:var(--gold); border-radius:50%; margin-right:5px; }
  #legend { position:fixed; left:16px; bottom:16px; font-size:11px; color:#6b6b70;
    background:rgba(255,255,255,.82); border:1px solid var(--line); border-radius:10px; padding:8px 11px; }
  #legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .hint { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); font-size:11px; color:#6b6b70;
    background:rgba(255,255,255,.78); border:1px solid var(--line); border-radius:999px; padding:5px 12px;
    max-width:calc(100% - 32px); text-align:center; transition:opacity .9s; }
  /* 操作提示看过一次就够了，7 秒后自己淡出，不长期占画面下方。 */
  .hint.gl-fade { opacity:0; pointer-events:none; }
  /* 窄容器（工作台把 3D 嵌成一条窄栏时）：浮层跟着容器走，不按桌面 px 硬撑 */
  @media (max-width:760px) {
    #hud { left:10px; top:10px; font-size:10.5px; padding:6px 9px; max-width:min(340px, calc(100% - 104px)); }
    #hud b { font-size:11px; }
    #hud .gl-mode { min-height:22px; padding:2px 8px; font-size:10px; }
    #panel { width:min(180px, 46%); top:10px; right:10px; max-height:calc(100% - 20px); padding:8px 9px; }
    #panel h4 { font-size:10px; margin:0 0 5px; }
    #panel .row { gap:4px; margin-bottom:7px; }
    #panel button { font-size:10.5px; padding:5px 7px; min-height:30px; }
    #circuits { max-height:18vh } #fixtures { display:none } .tipbox { display:none !important }
    #legend { display:none; }
    .room b { font-size:10px } .room span { font-size:8px } .room { padding:2px 6px }
    .hint { display:none }
  }
  /* 控件入口：面板收起时挂在右上（手机挂右下，避免压住「场景预览」那条），展开后自身隐藏，
     由面板里的 × 收起。基础样式必须写在 @media 之前，否则 media 里的 display 会被盖掉。 */
  .gl-tools { display:inline-flex; position:fixed; right:16px; top:16px; z-index:22; align-items:center;
    min-height:34px; padding:0 13px; border-radius:999px; border:1px solid var(--line);
    background:rgba(255,255,255,.94); color:#332b1e; font:inherit; font-size:12px; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.10); }
  .gl-tools[hidden] { display:none !important; }
  @media (max-width:760px) { .gl-tools { right:10px; top:10px; min-height:32px; padding:0 11px; font-size:11.5px; } }
  @media (max-width:430px) {
    #hud { max-width:calc(100% - 24px); font-size:10px; padding:6px 9px; border-radius:10px; }
    #hud b { font-size:11px; }
    #hud .gl-mode { min-height:24px; padding:2px 8px; font-size:10.5px; }
    #panel.gl-open { left:10px; right:10px; top:auto; bottom:10px; width:auto; max-height:66%; }
    /* 右下让位：工作台的「编号 / 功能清单」悬浮条就压在右下角 */
    .gl-tools { right:auto; left:10px; top:auto; bottom:10px; }
  }
  .gl-fail { position:fixed; left:50%; top:16px; transform:translateX(-50%); max-width:min(460px, calc(100% - 24px));
    padding:16px 20px; background:#fffdf9; border:1px solid #e4e1db; border-radius:12px;
    box-shadow:0 8px 24px #332b1e14; font:13px/1.55 -apple-system,sans-serif; color:#574f44; text-align:center; z-index:30; }
  .gl-fail b { display:block; margin-bottom:6px; font-size:14px; color:#332b1e; }
  .gl-fail p { margin:0 0 10px; font-size:12px; color:#8a8a8f; }
  .gl-fail .gl-btns { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .gl-fail button { min-height:34px; padding:7px 16px; font-size:12px; border:1px solid #e4e1db;
    border-radius:8px; background:#f7f4ef; color:#88693a; cursor:pointer; }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="hud">加载中…</div>
<button class="gl-tools" id="glTools" type="button" aria-controls="panel" aria-expanded="false">视角 / 图层</button>

<div id="panel">
  <button id="glClose" type="button" aria-label="收起控件">×</button>
  <h4 id="scenesH">灯光场景（点一下真的亮灭）</h4>
  <div class="row" id="scenes"></div>
  <div id="sceneNote" class="note"></div>
  <h4 id="circuitsH" style="margin-top:10px">回路（点可单独开关）</h4>
  <div id="circuits"></div>
  <h4>视角</h4>
  <div class="row">
    <button data-view="top">户型图</button>
    <button data-view="bird">鸟瞰</button>
    <button data-view="inside">室内视角</button>
  </div>
  <button id="btnSpin" style="width:100%;margin-bottom:10px">自动环绕</button>
  <h4>剖切高度</h4>
  <div class="cutline"><span>切到墙顶以下看布局</span><span id="cutVal"></span></div>
  <input id="cut" type="range" min="250" max="2900" step="50" value="2900">
  <h4 style="margin-top:12px">图层</h4>
  <div class="row">
    <button data-toggle="ceil">天花</button>
    <button data-toggle="light">灯位</button>
    <button data-toggle="switch">开关点位</button>
    <button data-toggle="furniture">家具</button>
    <button data-toggle="beams">光锥示意</button>
    <button data-toggle="ceilLine">吊顶线</button>
  </div>
  <div class="row" style="margin-bottom:0">
    <button id="btnLabel" class="on">空间名</button>
    <button id="btnLight" class="on">灯光演示</button>
    <button id="btnShot">截图</button>
  </div>
</div>

<div id="fixtures"></div>
<div id="tip" class="tipbox"></div>
<div id="legend">
  <i style="background:#c9a96e"></i>门　<i style="background:#9ec4d8"></i>窗　
  <i style="background:#ffd479"></i>灯位　<i style="background:#6ea8ff"></i>开关点位
</div>
<div class="hint">拖动旋转 · 滚轮/双指缩放 · 点灯具或回路开关灯 · 切场景看联动</div>


<script>
/* 光律 · 三维灯光场景外壳
 * 渲染内核（app.js）来自「优邑珺和-可执行灯光场景.html」，只改了一处手势：
 *   内核把「点击灯位开关灯」和「拖动旋转」绑在同一个 pointerdown 上，手一抖就把灯关了。
 *   这里改成 pointerup 且位移 < 6px 才算点击（2026-10-22）。
 * 参数：?project=<pid>&floor=<n>  或  ?scene=<json 地址>
 */
(function () {
  var q = new URLSearchParams(location.search);
  var canBack = q.get('back') === '1';
  var hudEl = document.getElementById('hud');
  var booted = false;       // 内核启动过
  var gotLevels = false;    // 工作台是否已把回路亮度发过来
  var userMode = false;     // 用户是否手动切过昼夜（手动优先，不再自动跳）
  var nightMode = false;    // 当前是否「灯光演示」（默认关：一进 3D 是日景）
  var chipEl = null;        // HUD 里的「看灯光演示」开关（重建 HUD 时要补回）
  var failed = false;       // 失败卡已出过（避免重复/被后续回调覆盖）

  function post(type, extra) {
    try {
      var msg = { type: type };
      if (extra) for (var k in extra) msg[k] = extra[k];
      if (parent && parent !== window) parent.postMessage(msg, location.origin);
    } catch (e) {}
  }

  // N1：空态/失败卡——标题 + 原因 + 动作（回二维 / 重试）。
  // D-06：卡片同时带 .fail 类（验收选择器 document.querySelector('.fail') 必须命中）；
  //       不再清空 body，保留 #hud 并改成明确的失败文案（不能停在「加载中…」）。
  function fail(msg, title, hint) {
    if (failed) return;
    failed = true;
    post('guanglv:fail', { reason: msg || '' });
    if (hudEl) {
      hudEl.classList.add('hud-fail');
      hudEl.textContent = '三维暂时打不开 · 见下方说明';
    }
    // 失败后收起内核面板/图例/操作提示等「假活」控件，避免用户继续点无效按钮。
    ['app', 'panel', 'fixtures', 'legend', 'tip', 'glTools', 'labels'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    var hintEl = document.querySelector('.hint');
    if (hintEl) hintEl.style.display = 'none';
    var card = document.createElement('div');
    card.className = 'gl-fail fail';
    var b = document.createElement('b');
    b.textContent = title || '这个项目还没有三维场景';
    var p = document.createElement('p');
    p.textContent = msg;
    card.appendChild(b);
    card.appendChild(p);
    if (hint) {
      var p2 = document.createElement('p');
      p2.textContent = hint;
      card.appendChild(p2);
    }
    var btns = document.createElement('div');
    btns.className = 'gl-btns';
    var retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = '重新加载';
    retry.addEventListener('click', function () { location.reload(); });
    btns.appendChild(retry);
    if (canBack) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '回二维平面图';
      btn.addEventListener('click', function () {
        parent.postMessage({ type: 'guanglv:back2d' }, location.origin);
      });
      btns.appendChild(btn);
    }
    card.appendChild(btns);
    document.body.appendChild(card);
  }

  function hasWebGL() {
    try {
      var c = document.createElement('canvas');
      return !!(c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'));
    } catch (e) { return false; }
  }

  // 内核自带的「情景按钮 / 回路列表 / 灯具清单」与工作台右栏重复，藏掉；
  // 但操作提示（.hint）保留——它说明能拖、能点灯，不该藏。
  var css = document.createElement('style');
  css.textContent =
    '#scenesH,#circuitsH,#scenes,#sceneNote,#circuits,#fixtures{display:none!important}';
  document.head.appendChild(css);

  // D-04 兜底光照：内核夜间模式（setLightingMode(true)）把半球光/主光/补光压到
  // 0.1 / 0.18 / 0.08，整屋黑到看不清（旧实测画布 avgLum=13、亮度<30 占 97.1%）。
  // 外壳侧加一盏常驻环境光 + 夜间把三盏光抬到可用区间：夜里既看得见户型，也仍看得出灯亮没亮。
  // 注意：只在「灯光演示」时抬，日景完全交给内核原值，不改变白天观感。
  var fallback = null;   // { amb, hemi, dirs }
  // 2026-10-26：旧值把整屋抬到发灰（amb 8.0 抹平明暗），光锥和家具轮廓一起糊掉。
  // 新值保留暗环境对比：墙/地能读出材质，灯下光斑仍是全画面最亮的一块。
  var FALLBACK_NIGHT = { hemi: 0.9, dirs: [1.2, 0.4], amb: 1.0, clear: 0x0d0e12 };

  // 光锥/光斑的昼夜外观：白天用普通混合，避免加色叠在浅色地板上糊成一片；
  // 夜里回到加色混合，让「灯亮着」一眼可见。数值是相对内核 n*.26 / n*1.05 的倍率。
  var BEAM_STYLE = {
    day:   { cone: 0xffb95e, coneMul: 1.55, pool: 0xffb45c, poolMul: 0.55, additive: false },
    night: { cone: 0xffc47a, coneMul: 2.25, pool: 0xffc06e, poolMul: 0.85, additive: true },
  };

  function collectLights() {
    var v = window.__viewer;
    if (!v) return false;
    if (fallback) return true;
    var hemi = null, dirs = [];
    v.scene.traverse(function (o) {
      if (o.isHemisphereLight) hemi = o;
      else if (o.isDirectionalLight) dirs.push(o);
    });
    var amb = new v.THREE.AmbientLight(0xffeedd, 0);
    v.scene.add(amb);
    fallback = { amb: amb, hemi: hemi, dirs: dirs };
    return true;
  }

  function applyFallback(night) {
    if (!collectLights()) return;
    var v = window.__viewer;
    if (night) {
      var cfg = FALLBACK_NIGHT;
      if (fallback.hemi) fallback.hemi.intensity = cfg.hemi;
      fallback.dirs.forEach(function (d, i) { d.intensity = cfg.dirs[i] || 0; });
      fallback.amb.intensity = cfg.amb;
      v.renderer.setClearColor(cfg.clear, 1);
    } else {
      // setLightingMode(false) 已把内核光恢复成日景原值；这里补一点暖环境光，

  // 内核每帧/每次调亮度都会直接写 cone.material.opacity = n*.26，
  // 外壳不改 app.js，只在材质上装一个「倍率代理」：内核照常写基准值，读出时乘昼夜倍率。

      get: function () {

  // 外壳不再按半角重算一遍——两条各算各的，换 SKU、上实测 IES 在这条渲染路径上就永远是假的
  // （阶段 1.5 验收③）。内核原来还按灯具类型套固定光束角，同一盏灯装 2.8 m 和 2.2 m 画一样大。

    var v = window.__viewer;

    var T = v.THREE;
    var ceil = Number((window.__SCENE__ || {}).height_m) || 2.8;
    v.lumList.forEach(function (item) {

      if (!isFinite(mount) || mount <= 0.1) mount = Math.min(ceil - 0.05, 2.6);
      var H = Math.max(0.25, Math.min(ceil - 0.02, mount - 0.02));

  }

  function hudLine(extra) {

  // 墙/地/窗也统一成暖色木作模型：墙奶白、地面浅橡木、夜里保留可读的灰度，
  // 窗玻璃夜里压成深蓝而不是四块发光白板。内核的昼夜切换会重写颜色，所以外壳
  // 每次 setMode 之后再套一遍自己的色板。
  // 白天墙面的受光面已经接近奶白，但背光面只剩半球光的一半，整屋读起来发灰。
  // 给墙material加一点暖色自发光把暗面提亮，同时保留光锥/灯下光斑的亮度优势。
  function roomAtPoint(x, z) {
    var rooms = ((window.__SCENE__ || {}).rooms) || [];
    var best = null, bestD = 1e9;
    for (var i = 0; i < rooms.length; i++) {
      var r = rooms[i], poly = r && r.poly;
      if (!poly || poly.length < 3) continue;
      var hit = false;
      for (var a = 0, b = poly.length - 1; a < poly.length; b = a++) {
        var xi = poly[a][0], yi = poly[a][1], xj = poly[b][0], yj = poly[b][1];
        if ((yi > z) !== (yj > z) && x < (xj - xi) * (z - yi) / (yj - yi) + xi) hit = !hit;
      }
      if (hit) return r;
      var d = Math.hypot((r.cx || 0) - x, (r.cy || 0) - z);
      if (d < bestD) { bestD = d; best = r; }
    }
    return best;
  }

  function unifyWalls() {
    var v = window.__viewer;
    if (!v || !v.groups.wall) return;
    var first = null, meshes = [];
    v.groups.wall.traverse(function (o) {

    });
    if (!first) return;
    meshes.forEach(function (o) { o.material = first; });
    worldMats.wall = first;
  }

  function makeFloorTexture() {
    var v = window.__viewer;
    if (!v) return null;
    var T = v.THREE;
    var c = document.createElement('canvas');
    c.width = c.height = 512;
    var g = c.getContext('2d');
    g.fillStyle = '#d9bd93';
    g.fillRect(0, 0, 512, 512);
    var rows = 16, rh = 512 / rows;
    for (var r = 0; r < rows; r++) {
      var y = r * rh;
      g.fillStyle = 'rgba(' + (r % 3 === 0 ? '255,240,214' : r % 3 === 1 ? '208,170,120' : '226,196,152') + ',.10)';
      g.fillRect(0, y, 512, rh);
      for (var k = 0; k < 10; k++) {
        var yy = y + 2 + Math.random() * (rh - 4);
        g.strokeStyle = 'rgba(112,76,42,' + (0.05 + Math.random() * 0.07) + ')';
        g.lineWidth = 1;
        g.beginPath();
        for (var x = 0; x <= 512; x += 32) g.lineTo(x, yy + Math.sin((x + k * 37) * 0.02) * 1.2);

      g.fillRect(0, y + rh - 1.4, 512, 1.4);
      for (var x2 = (r % 2 ? 128 : 0); x2 < 512; x2 += 256) {

    tex.wrapS = tex.wrapT = T.RepeatWrapping;

    tex.anisotropy = Math.min(8, v.renderer.capabilities.getMaxAnisotropy());
    tex.colorSpace = T.SRGBColorSpace;
    return tex;
  }

  function makeTileTexture() {
    var v = window.__viewer;
    if (!v) return null;
    var T = v.THREE;
    var c = document.createElement('canvas');
    c.width = c.height = 512;
    var g = c.getContext('2d');
    g.fillStyle = '#e7e0d3';
    g.fillRect(0, 0, 512, 512);
    var n = 4, s = 512 / n;
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < n; j++) {
        g.fillStyle = 'rgba(' + ((i + j) % 2 ? '206,198,184' : '255,250,240') + ',.28)';
        g.fillRect(i * s + 1, j * s + 1, s - 2, s - 2);

    g.strokeStyle = 'rgba(132,124,110,.34)';
    g.lineWidth = 2;

      g.beginPath(); g.moveTo(k * s, 0); g.lineTo(k * s, 512); g.stroke();

  function initWorldStyle() {

  // 内核把阳台 5 m 级的「门」画成一整块不透明板，鸟瞰正对着像一堵棕墙。

      bar(0.05, H, W / 2 - 0.025, H / 2);
      bar(W, 0.05, 0, H - 0.025);
      bar(W, 0.05, 0, 0.025);
      bar(W, 0.035, 0, 1.02); // 推拉门中梃在 1 m 处，剖切到墙顶以下也还认得出
      for (var i = 1; i <= 3; i++) bar(0.04, H - 0.1, -W / 2 + i * W / 4, H / 2);
      o.parent.add(g);

  // 家具数据只有 kind + 包围盒，没有部件信息；按类型做程序化拆件：
  // 沙发有扶手/坐垫/靠包，柜子有踢脚/门板/拉手/台面，厨卫有灶眼/水槽/龙头。
  // 所有部件按材质合并成 1~4 个 mesh，既保住细节又不把 draw call 拉爆。
  function buildFurniture() {
    var v = window.__viewer;
    if (!v || !v.THREE || !v.scene || !v.groups) return null;
    var T = v.THREE;
    var rows = (window.__SCENE__ || {}).furniture || [];
    if (!Array.isArray(rows) || !rows.length) return null;
    FURN_T = T;
    FURN_CLIP = v.clipPlane ? [v.clipPlane] : null;
    var scene = window.__SCENE__ || {};
    var rooms = (scene.rooms || []).filter(function (r) { return r && r.poly && r.poly.length >= 3; });
    var walls = scene.walls || [];

    function inPoly(x, y, poly) {
      var hit = false;
      for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) hit = !hit;
      }
      return hit;
    }
    function roomAt(x, z) {
      var best = null, bestD = 1e9;
      rooms.forEach(function (r) {
        if (inPoly(x, z, r.poly)) { best = r; bestD = -1; }
        else if (bestD > 0) {
          var d = Math.hypot((r.cx || 0) - x, (r.cy || 0) - z);

        var cx = 0, cz = 0;
        p.forEach(function (q) { cx += q[0]; cz += q[1]; });
        cx /= p.length; cz /= p.length;
        var d = Math.hypot(cx - x, cz - z);
        if (d < best) { best = d; dir = [x - cx, z - cz]; }

      var n = Math.hypot(dir[0], dir[1]) || 1;
      return [dir[0] / n, dir[1] / n];
    }
    // 包围盒只给长/宽，朝向靠房间中心推：正面永远朝屋里，背面靠墙。
    // 房间中心恰好落在柜体里（整间衣帽间）时，退化成「背对最近一面墙」。
    function chooseYaw(x, z, base) {

      if (kind.indexOf('矮柜') >= 0) return lowCabinet(kit, L, D, H);
      if (kind.indexOf('餐桌') >= 0) return diningTable(kit, L, D, H);
      if (kind.indexOf('灶台') >= 0) return cooktop(kit, L, D, H);
      if (kind.indexOf('水槽') >= 0) return sinkUnit(kit, L, D, H);
      if (kind.indexOf('台盆') >= 0) return vanity(kit, L, D, H);
      if (kind.indexOf('边几') >= 0) return sideTable(kit, L, D, H, ctx);
      if (kind.indexOf('通用') >= 0) return pottedPlant(kit, L, D, H);
      return fallbackCabinet(kit, L, D, H);
    }

    function addContactShadows(group, recs) {
      var c = document.createElement('canvas');
      c.width = c.height = 128;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(64, 64, 4, 64, 64, 62);
      grd.addColorStop(0, 'rgba(32,23,14,.40)');
      grd.addColorStop(0.55, 'rgba(32,23,14,.18)');
      grd.addColorStop(1, 'rgba(32,23,14,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);
      var tex = new T.CanvasTexture(c);
      tex.colorSpace = T.SRGBColorSpace;
      var mat = new T.MeshBasicMaterial({
        map: tex, transparent: true, opacity: 0.56, depthWrite: false,
        polygonOffset: true, polygonOffsetFactor: -2,
      });
      var geo = new T.PlaneGeometry(1, 1);
      geo.rotateX(-Math.PI / 2);
      var inst = new T.InstancedMesh(geo, mat, Math.max(1, recs.length));
      inst.frustumCulled = false;
      var m = new T.Matrix4(), p = new T.Vector3(), q = new T.Quaternion();
      var s = new T.Vector3(), e = new T.Euler();
      recs.forEach(function (r, i) {
        e.set(0, r.yaw || 0, 0); q.setFromEuler(e);
        p.set(r.x, 0.006, -r.z);
        s.set(r.L * 1.10, 1, r.D * 1.16);
        m.compose(p, q, s);
        inst.setMatrixAt(i, m);
      });
      inst.instanceMatrix.needsUpdate = true;
      group.add(inst);
      furnShadow = inst;
    }

    var list = dedupe(rows);
    var group = new T.Group();
    group.name = 'furniture';
    var shadows = [];
    list.forEach(function (f, idx) {
      var d = dimsOf(f);
      var kind = String(f.kind || '');
      var base;
      if (Array.isArray(f.pts) && f.pts.length >= 3) base = polyYaw(f.pts);
      else base = (d.w >= d.d ? 0 : Math.PI / 2) - (Number(f.rot) || 0) * Math.PI / 180;
      var yaw = chooseYaw(d.x, d.z, base);
      var parts = [];
      var kit = makeKit(parts);
      buildKind(kind, d.L, d.D, d.h, kit, { f: f, d: d, idx: idx });
      var item = new T.Group();
      item.position.set(d.x, 0.012, -d.z);
      item.rotation.y = yaw;
      mergeInto(item, parts);
      var rec = {
        kind: kind, L: d.L, D: d.D, H: d.h, x: d.x, z: d.z, yaw: yaw,
        group: item, meshes: [], room: '',
      };
      var r = roomAt(d.x, d.z);
      if (r) rec.room = r.name || '';
      item.traverse(function (o) {
        if (o.isMesh) { o.userData.furn = rec; rec.meshes.push(o); }
      });
      item.userData.furn = rec;
      furnItems.push(rec);
      group.add(item);
      shadows.push({ x: d.x, z: d.z, L: d.L, D: d.D, yaw: yaw });
    });
    addContactShadows(group, shadows);
    group.visible = true;
    v.scene.add(group);
    v.groups.furniture = group;
    furnGroup = group;
    return group;
  }

  // 2026-10-26：内核鸟瞰按固定系数摆机位，宽屏下整屋只占画面一半、窄屏又会切边。
  // 这里按地面包围盒做一次二分取景：八个角都落进 NDC 安全框，取最近的那个距离。
  // 用户自己转过/切过视角后不再抢镜头（只对默认鸟瞰和「鸟瞰 45°」按钮生效）。
  var viewTouched = false;
  var birdView = true;

  function fitCamera(force) {
    var v = window.__viewer;
    if (!v || !v.camera || !v.controls || !v.groups || !v.groups.floor) return;
    if (!force && viewTouched && !birdView) return;
    var T = v.THREE;
    var box = new T.Box3().setFromObject(v.groups.floor);
    if (box.isEmpty()) return;
    var scene = window.__SCENE__ || {};
    var ceil = Number(scene.height_m) || 2.8;
    box.min.y = 0;
    box.max.y = Math.max(ceil, box.max.y);

    var target = new T.Vector3(
      (box.min.x + box.max.x) / 2,
      (box.max.y - box.min.y) * 0.20,
      (box.min.z + box.max.z) / 2
    );
    var cam = v.camera;
    var ctl = v.controls;
    var portrait = window.innerWidth < 460 && window.innerHeight > window.innerWidth * 1.5;
    // 2026-10-26：45° 对角机位把 14×10 m 的户型投成 1.27:1，16:9 画布左右各空 20%。
    // 收到 25°/38°：投影接近 1.5:1，整屋能占到七成以上宽度，同时保留斜看进房间的深度。
    // 竖屏手机反过来：从东侧看，让 14 m 长边竖着落在画面里，否则整屋只有一条窄带。
    var dir = portrait
      ? new T.Vector3(0.809, 0.588, 0).normalize()
      : new T.Vector3(0.333, 0.616, 0.714).normalize();
    cam.fov = portrait ? 48 : 42;
    cam.near = 0.1;
    cam.far = 500;
    cam.up.set(0, 1, 0);

    // 取景用真实地面轮廓，而不是 floor 的 bbox 角：L 形户型的外接矩形有不少空角，
    // 那些空角会把镜头顶远，实际户型只占画面一半。墙顶按当前剖切高度算（剖切以上不渲染）。
    var pts = [];
    var wallTop = v.clipPlane ? Number(v.clipPlane.constant) : ceil;
    if (!isFinite(wallTop) || wallTop <= 0.1) wallTop = ceil;
    wallTop = Math.min(ceil, wallTop);
    (scene.floor || []).forEach(function (poly) {
      (poly.outer || []).forEach(function (q) {
        pts.push(new T.Vector3(q[0], 0, -q[1]));
        pts.push(new T.Vector3(q[0], wallTop, -q[1]));
      });
    });
    if (!pts.length) {
      [box.min.x, box.max.x].forEach(function (x) {
        [box.min.y, box.max.y].forEach(function (y) {
          [box.min.z, box.max.z].forEach(function (z) { pts.push(new T.Vector3(x, y, z)); });
        });
      });
    }
    var p = new T.Vector3();
    var margin = 1 / 1.14; // 户型最多占画面 ~88%，留出 HUD/面板和家具外沿
    function fits(d) {
      cam.position.copy(target).addScaledVector(dir, d);
      cam.lookAt(target);
      cam.updateMatrixWorld(true);
      cam.updateProjectionMatrix();
      for (var i = 0; i < pts.length; i++) {
        p.copy(pts[i]).project(cam);
        if (p.z > 1 || Math.abs(p.x) > margin || Math.abs(p.y) > margin) return false;
      }
      return true;
    }
    var lo = 3, hi = 200;
    if (!fits(hi)) return;
    for (var i = 0; i < 26; i++) {
      var mid = (lo + hi) / 2;
      if (fits(mid)) hi = mid; else lo = mid;
    }
    cam.position.copy(target).addScaledVector(dir, hi);
    cam.updateProjectionMatrix();
    ctl.target.copy(target);
    ctl.update();
  }

  // 2026-10-26：内核「室内视角」把机位放在休闲阳台贴着门板，画面里只有门和地面，
  // 家具全被挡住。外壳改成落到最大一间房（客厅）的南侧、朝北看整间房。
  // 只在用户点「室内视角」时接管，点回鸟瞰/户型图后交给内核和 fitCamera。
  function insideView() {
    var v = window.__viewer;
    if (!v || !v.camera || !v.controls) return;
    var scene = window.__SCENE__ || {};
    var rooms = scene.rooms || [];
    var room = null;
    rooms.forEach(function (r) {
      if (!r || !r.poly || !r.poly.length) return;
      if (!room || (r.area_m2 || 0) > (room.area_m2 || 0)) room = r;
    });
    if (!room) return;
    var poly = room.poly;
    function inPoly(x, y) {
      var hit = false;
      for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) hit = !hit;
      }
      return hit;
    }
    var xs = poly.map(function (p) { return p[0]; });
    var ys = poly.map(function (p) { return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var inset = Math.min(0.6, Math.min(x1 - x0, y1 - y0) * 0.12);
    // 家具中心（设计坐标）；有 pts 的取多边形均值，没有的取 x/z。
    var furn = (scene.furniture || []).map(function (f) {
      if (Array.isArray(f.pts) && f.pts.length) {
        var sx = 0, sy = 0;
        f.pts.forEach(function (p) { sx += p[0]; sy += p[1]; });
        return [sx / f.pts.length, sy / f.pts.length, Number(f.h) || 0.6];
      }
      return [Number(f.x) || 0, Number(f.z) || 0, Number(f.h) || 0.6];
    }).filter(function (f) { return f[2] > 0.1 && inPoly(f[0], f[1]); });

    // 房间四角里挑离家具最远、且确实落在地面内的那个：站得开，才看得清家具。
    var corners = [
      [x0 + inset, y0 + inset], [x1 - inset, y0 + inset],
      [x0 + inset, y1 - inset], [x1 - inset, y1 - inset],
    ];
    var best = null, bestGap = -1;
    corners.forEach(function (c) {
      if (!inPoly(c[0], c[1])) return;
      var gap = 1e9;
      furn.forEach(function (f) {
        var dx = f[0] - c[0], dy = f[1] - c[1];
        gap = Math.min(gap, dx * dx + dy * dy);
      });
      if (gap > bestGap) { bestGap = gap; best = c; }
    });
    if (!best) best = [room.cx, room.cy];

    // 看向房间里的家具；没有家具就看房间中心。
    var tx = room.cx, tz = room.cy;
    if (furn.length) {
      tx = 0; tz = 0;
      furn.forEach(function (f) { tx += f[0]; tz += f[1]; });
      tx /= furn.length; tz /= furn.length;
    }
    // 竖屏横向视场只有约 31°，3.3 m 的沙发会被裁掉一半；放宽视场并抬高机位才装得下整间客厅。
    var portrait = window.innerHeight > window.innerWidth * 1.15;
    v.camera.fov = portrait ? 74 : 62;
    v.camera.position.set(best[0], portrait ? 1.75 : 1.55, -best[1]);
    v.controls.target.set(tx, portrait ? 0.80 : 0.95, -tz);
    v.camera.updateProjectionMatrix();
    v.controls.update();
  }

  // ===== 易用性：点空间名/家具聚焦，悬停看名称尺寸 =====================
  var camTween = null;
  var viewMode = 'bird';

  function cancelTween() {
    if (camTween) { cancelAnimationFrame(camTween.raf); camTween = null; }
  }

  function tweenCamera(pos, target, ms) {
    var v = window.__viewer;
    if (!v || !v.camera || !v.controls) return;
    cancelTween();
    var c = v.camera, ctl = v.controls;
    var p0 = c.position.clone(), t0 = ctl.target.clone();
    var p1 = pos.clone(), t1 = target.clone();
    var start = performance.now();
    camTween = { raf: 0 };
    function step(now) {
      var k = Math.min(1, (now - start) / ms);
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      c.position.lerpVectors(p0, p1, e);
      ctl.target.lerpVectors(t0, t1, e);
      c.updateProjectionMatrix();
      ctl.update();
      if (k < 1) camTween.raf = requestAnimationFrame(step);
      else camTween = null;
    }
    camTween.raf = requestAnimationFrame(step);
  }

  function obliqueDir() {
    var v = window.__viewer;
    var d = new v.THREE.Vector3().subVectors(v.camera.position, v.controls.target);
    d.y = 0;
    if (d.lengthSq() < 0.01) d.set(0.5, 0, 0.8);
    d.normalize();
    d.y = 0.78;
    return d.normalize();
  }

  function hideFurnTip() {
    var t = document.getElementById('ftip');
    if (t) t.classList.remove('show');
  }

  function focusRoom(room) {
    var v = window.__viewer;
    if (!v || !room || !room.poly || !room.poly.length) return;
    hideFurnTip();
    var T = v.THREE;
    var xs = room.poly.map(function (p) { return p[0]; });
    var zs = room.poly.map(function (p) { return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var z0 = Math.min.apply(null, zs), z1 = Math.max.apply(null, zs);
    var ceil = Number((window.__SCENE__ || {}).height_m) || 2.7;
    var target = new T.Vector3((x0 + x1) / 2, Math.min(1.15, ceil * 0.42), -(z0 + z1) / 2);
    var diag = Math.max(2.4, Math.hypot(x1 - x0, z1 - z0));
    var dist = Math.min(17, Math.max(5.2, diag * 1.22));
    tweenCamera(target.clone().addScaledVector(obliqueDir(), dist), target, 620);
    viewTouched = true;
    birdView = false;
    viewMode = 'room';
  }

  function focusFurniture(rec) {
    var v = window.__viewer;
    if (!v || !rec) return;
    hideFurnTip();
    var T = v.THREE;
    var target = new T.Vector3(rec.x, Math.min(1.05, Math.max(0.25, rec.H * 0.6)), -rec.z);
    var diag = Math.max(1.2, Math.hypot(rec.L, rec.D));
    var dist = Math.min(12, Math.max(3.4, diag * 1.55));
    tweenCamera(target.clone().addScaledVector(obliqueDir(), dist), target, 560);
    viewTouched = true;
    birdView = false;
    viewMode = 'room';
  }

  function setupLabels() {
    var v = window.__viewer;
    var labelsEl = document.getElementById('labels');
    if (!v || !labelsEl || !v.roomEls) return;
    var rooms = (window.__SCENE__ || {}).rooms || [];
    var order = rooms.map(function (r, i) { return { i: i, a: Number(r && r.area_m2) || 0 }; })
      .sort(function (x, y) { return y.a - x.a; });
    var rank = {};
    order.forEach(function (o, k) { rank[o.i] = k; });
    v.roomEls.forEach(function (row, i) {
      var rm = rooms[i];
      if (rm) row.el.title = (rm.name || '') + ' · ' + (rm.area_m2 || '') + ' ㎡ · 点击聚焦';
    });
    labelsEl.addEventListener('click', function (e) {
      var el = e.target;
      while (el && el !== labelsEl && !/room/.test(el.className || '')) el = el.parentNode;
      if (!el || el === labelsEl) return;
      var idx = Array.prototype.indexOf.call(labelsEl.children, el);
      if (idx >= 0 && rooms[idx]) focusRoom(rooms[idx]);
    });
    function cap() {
      if (viewMode === 'inside') return 0;
      var w = window.innerWidth;
      return w <= 430 ? 3 : (w <= 980 ? 4 : 5);
    }
    var last = 0;
    function tick(now) {
      requestAnimationFrame(tick);
      if (labelsEl.style.display === 'none') return;
      var vw = window.innerWidth, vh = window.innerHeight;
      // 内核每帧先写 left/top；这里只把还没收起的标签夹回视口（每帧，避免跳）。
      for (var i = 0; i < v.roomEls.length; i++) {
        var el = v.roomEls[i].el;
        if (el.classList.contains('lab-hide') || el.style.display === 'none') continue;
        var l = parseFloat(el.style.left), t = parseFloat(el.style.top);
        if (!isFinite(l) || !isFinite(t)) continue;
        var ew = el.offsetWidth || 34, eh = el.offsetHeight || 16;
        var nl = Math.min(Math.max(l, ew / 2 + 4), Math.max(ew / 2 + 4, vw - ew / 2 - 4));
        var nt = Math.min(Math.max(t, eh / 2 + 4), Math.max(eh / 2 + 4, vh - eh / 2 - 4));
        if (Math.abs(nl - l) > 0.5) el.style.left = nl + 'px';
        if (Math.abs(nt - t) > 0.5) el.style.top = nt + 'px';
      }
      if (now - last < 120) return;
      last = now;
      var max = cap(), shown = [];
      for (var j = 0; j < v.roomEls.length; j++) {
        var row = v.roomEls[j], node = row.el;
        var hidden = node.style.display === 'none';
        var l2 = parseFloat(node.style.left), t2 = parseFloat(node.style.top);
        var outside = hidden || !isFinite(l2) || !isFinite(t2) ||
          l2 < -6 || l2 > vw + 6 || t2 < -6 || t2 > vh + 6;
        var hide = outside || rank[j] === undefined || rank[j] >= max;
        var w2 = node.offsetWidth || 34, h2 = node.offsetHeight || 16;
        var nl2 = Math.min(Math.max(l2 || 0, w2 / 2 + 4), Math.max(w2 / 2 + 4, vw - w2 / 2 - 4));
        var nt2 = Math.min(Math.max(t2 || 0, h2 / 2 + 4), Math.max(h2 / 2 + 4, vh - h2 / 2 - 4));
        if (!hide) {
          for (var k = 0; k < shown.length; k++) {
            var s = shown[k];
            if (Math.abs(nl2 - s.l) < (w2 + s.w) / 2 + 6 &&
                Math.abs(nt2 - s.t) < (h2 + s.h) / 2 + 4) { hide = true; break; }
          }
        }
        if (!hide) shown.push({ l: nl2, t: nt2, w: w2, h: h2 });
        node.classList.toggle('lab-hide', hide);
        if (!hide) {
          if (Math.abs(nl2 - l2) > 0.5) node.style.left = nl2 + 'px';
          if (Math.abs(nt2 - t2) > 0.5) node.style.top = nt2 + 'px';
        }
      }
    }
    requestAnimationFrame(tick);
  }

  function setupFurnitureHover() {
    var v = window.__viewer;
    if (!v || !furnItems.length) return;
    var tip = document.createElement('div');
    tip.id = 'ftip';
    tip.style.transform = 'none';
    document.body.appendChild(tip);
    var canvas = v.renderer.domElement;
    var ray = new v.THREE.Raycaster();
    var ndc = new v.THREE.Vector2();
    var meshes = [];
    furnItems.forEach(function (it) { it.meshes.forEach(function (m) { meshes.push(m); }); });
    var hover = null, pending = false, lastEv = null, down = null;

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function place(ev) {
      var x = ev.clientX + 14, y = ev.clientY + 14;
      var w = tip.offsetWidth || 150, h = tip.offsetHeight || 28;
      if (x + w > window.innerWidth - 8) x = ev.clientX - w - 18;
      if (y + h > window.innerHeight - 8) y = ev.clientY - h - 18;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    }
    function setHover(rec, ev) {
      if (hover === rec) { if (rec && ev) place(ev); return; }
      if (hover) {
        hover.meshes.forEach(function (m) {
          if (m.material && m.material.emissive) {
            m.material.emissive.setHex(0x000000);
            m.material.emissiveIntensity = 0;
          }
        });
      }
      hover = rec;
      if (!rec) { tip.classList.remove('show'); return; }
      rec.meshes.forEach(function (m) {
        if (m.material && m.material.emissive) {
          m.material.emissive.setHex(0x8a6636);
          m.material.emissiveIntensity = nightMode ? 0.55 : 0.30;
        }
      });
      tip.innerHTML = '<i></i><b>' + esc(rec.kind || '家具') + '</b>　' +
        rec.L.toFixed(1) + ' × ' + rec.D.toFixed(1) + ' m' +
        (rec.room ? ' · ' + esc(rec.room) : '');
      tip.classList.add('show');
      if (ev) place(ev);
    }
    function pick(ev) {
      var r = canvas.getBoundingClientRect();
      ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, v.camera);
      var hits = ray.intersectObjects(meshes, false);
      return hits.length ? hits[0].object.userData.furn : null;
    }
    canvas.addEventListener('pointermove', function (ev) {
      if (ev.pointerType === 'touch' || ev.buttons) return;
      lastEv = ev;
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        pending = false;
        if (!lastEv) return;
        setHover(pick(lastEv), lastEv);
      });
    });
    canvas.addEventListener('pointerleave', function () { setHover(null); });
    canvas.addEventListener('pointerdown', function (ev) {
      down = { x: ev.clientX, y: ev.clientY, t: Date.now() };
    });
    canvas.addEventListener('pointerup', function (ev) {
      if (!down) return;
      var moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y);
      var held = Date.now() - down.t;
      down = null;
      if (moved > 7 || held > 650) return;
      var rec = pick(ev);
      if (!rec) return;
      if (ev.pointerType === 'touch') {
        setHover(rec, ev);
        setTimeout(function () { if (hover === rec) setHover(null); }, 1500);
      }
      focusFurniture(rec);
    });
  }

  /* 灯位详情卡（阶段 1.5 验收①④）
   * 内核自己把「点一盏灯＝切换它那条回路」绑在 pointerdown 上（这条行为保留＝验收②）；
   * 外壳在 pointerup 之后补一张卡，把 §7.5/§7.6 的四组字段（回路／开孔／SKU／驱动）连同
   * 缺件清单一起摊开。字段口＝JSON 里的 lights_meta[i].info（backend/lighting3d._fixture_info），
   * 这里只展示、不另算一份；值一律走 textContent（型号与回路名都是人填的字符串）。
   */
  var LAMP_GROUPS = { circuit: '回路', opening: '开孔', sku: 'SKU／产品', driver: '驱动' };
  var lampCard = null;

  function lcEl(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function hideLampCard() { if (lampCard) lampCard.classList.remove('show'); }
  function showLampCard(item, ev) {
    var v = window.__viewer;
    var m = (item && item.meta) || {};
    var info = m.info || null;
    if (!lampCard) {
      lampCard = lcEl('div'); lampCard.id = 'lampCard';
      document.body.appendChild(lampCard);
    }
    lampCard.textContent = '';
    var x = lcEl('button', 'lc-x', '×'); x.type = 'button';
    x.setAttribute('aria-label', '关闭灯位详情');
    x.addEventListener('click', hideLampCard);
    lampCard.appendChild(x);
    lampCard.appendChild(lcEl('h5', null,
      ((info && info.code) || m.kind || '灯位') + ' · ' + (m.room || '未分区')));
    lampCard.appendChild(lcEl('div', 'lc-sub', [
      m.kind || '灯具',
      isFinite(Number(m.poolR)) && Number(m.poolR) > 0 ? ('光斑 R ' + Number(m.poolR).toFixed(2) + 'm') : '光斑半径未算',
      m.photometry || '配光口径未标',
    ].join(' · ')));

    if (!info) {
      // 验收④：点了必有反应。这一盏连字段包都没带＝数据缺口，要把它说出来。
      var gap0 = lcEl('div', 'lc-miss');
      gap0.appendChild(lcEl('b', null, '数据缺口'));
      gap0.appendChild(lcEl('div', null,
        '这份场景没带这一盏的字段包（回路／开孔／SKU／驱动都取不到）——不是「点了没反应」，' +
        '是它在数据口上就没有内容。请回布灯画布补录，或重新生成三维。'));
      lampCard.appendChild(gap0);
    } else {
      var miss = info.missing || [];
      if (miss.length) {
        var box = lcEl('div', 'lc-miss');
        box.appendChild(lcEl('b', null, '数据缺口 ' + miss.length + ' 项（不是这盏灯没有，是这一格没填）'));
        var ul = lcEl('ul');
        miss.forEach(function (t) { ul.appendChild(lcEl('li', null, t)); });
        box.appendChild(ul);
        lampCard.appendChild(box);
      }
      if (info.orphan) {
        lampCard.appendChild(lcEl('div', 'lc-foot',
          '图纸解析出来的三维灯位，还没回填到设计：开孔、驱动等字段要在设计侧录入后才显示。'));
      }
      Object.keys(LAMP_GROUPS).forEach(function (k) {
        var rows = (info.groups || {})[k] || [];
        lampCard.appendChild(lcEl('div', 'lc-grp', LAMP_GROUPS[k] + (rows.length ? '' : '（接口没给这一组）')));
        rows.forEach(function (r) {
          var row = lcEl('div', 'lc-row');
          row.appendChild(lcEl('span', 'lc-k', r.label));
          row.appendChild(lcEl('span', 'lc-v', String(r.value == null ? '' : r.value) || '—（未填）'));
          lampCard.appendChild(row);
        });
      });
    }
    var st = v && v.circuitState ? v.circuitState[m.circuit] : null;
    lampCard.appendChild(lcEl('div', 'lc-foot',
      '点这盏灯同时切换回路「' + (m.circuit || '未分区') + '」→ 现在' + (st > 0.02 ? '是开' : '是关')));

    lampCard.classList.add('show');
    var r = lampCard.getBoundingClientRect();
    var left = (ev ? ev.clientX : 120) + 16, top = (ev ? ev.clientY : 120) + 12;
    if (left + r.width > window.innerWidth - 8) left = (ev.clientX) - r.width - 18;
    if (top + r.height > window.innerHeight - 8) top = window.innerHeight - r.height - 12;
    lampCard.style.left = Math.max(8, left) + 'px';
    lampCard.style.top = Math.max(8, top) + 'px';
    // 验收脚本读的快照：与面板同源，不靠人截图核对。
    window.__glLamp = { code: (info && info.code) || m.kind || '', room: m.room || '',
      circuit: m.circuit || '', circuitOn: !!st && st > 0.02, poolR: m.poolR == null ? null : +m.poolR,
      photometry: m.photometry || '', unverified: m.unverified === true,
      hasInfo: !!info, missing: (info && info.missing) || [],
      groups: (info && info.groups) || {}, orphan: !!(info && info.orphan),
      text: lampCard.textContent };
  }
  function setupLampCard() {
    var v = window.__viewer;
    if (!v || !v.THREE || !v.groups || !v.groups.lum || !Array.isArray(v.lumList)) return;
    var ray = new v.THREE.Raycaster(), ndc = new v.THREE.Vector2(), down = null;
    var canvas = v.renderer.domElement;
    canvas.addEventListener('pointerdown', function (ev) { down = { x: ev.clientX, y: ev.clientY }; });
    canvas.addEventListener('pointerup', function (ev) {
      if (!down) return;
      var moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y);
      down = null;
      if (moved > 7) return;                 // 拖动旋转不算点灯
      var rect = canvas.getBoundingClientRect();
      ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1,
              -((ev.clientY - rect.top) / rect.height) * 2 + 1);
      ray.setFromCamera(ndc, v.camera);
      var hit = ray.intersectObjects(v.groups.lum.children, false)[0];
      if (!hit) { hideLampCard(); return; }
      var item = null;
      for (var i = 0; i < v.lumList.length; i++) {
        if (v.lumList[i].body === hit.object) { item = v.lumList[i]; break; }
      }
      if (!item) { hideLampCard(); return; }
      showLampCard(item, ev);
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') hideLampCard(); });
  }

  function setupCeilLine() {
    var v = window.__viewer;
    if (!v || !v.groups || !v.groups.ceilLine) return;
    var g = v.groups.ceilLine;
    g.visible = false; // 默认收起：吊顶线和家具轮廓线是“图纸信息”，不是情景本身
    g.traverse(function (o) {
      if (o.isLineSegments && o.material) {
        o.material.color.setHex(0x93a3b4);
        o.material.opacity = 0.42;
        o.material.clippingPlanes = [v.clipPlane];
        o.material.needsUpdate = true;
      }
    });
    var btn = document.querySelector('[data-toggle="ceilLine"]');
    if (btn) {
      btn.classList.remove('on');
      btn.title = '吊顶线默认收起；把剖切抬到墙顶以上再看';
    }
  }

  function syncLayerButtons() {
    var v = window.__viewer;
    if (!v || !v.groups) return;
    Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'), function (b) {
      var g = v.groups[b.getAttribute('data-toggle')];
      if (g) b.classList.toggle('on', !!g.visible);
    });
  }

  function boot(scene) {
    if (!hasWebGL()) {
      fail('浏览器没有启用 WebGL（或显卡加速被关闭）。同一份户型可以在「图纸」页用二维平面图查看。',
        '这台设备暂时打不开三维', '换 Chrome / Edge 打开，或在设置里打开「使用硬件加速」。');
      return;
    }
    window.__SCENE__ = scene;

    // 观察失败：内核建渲染器时若抛错（驱动异常），3 秒内没有 canvas 就出失败卡。
    var watchdog = setTimeout(function () {
      if (!booted || !document.querySelector('#app canvas')) {
        fail('三维内核没能启动（渲染器创建失败或超时）。可以先用二维平面图继续做方案。',
          '三维暂时打不开', 'files：app.js 可能被网络/缓存拦住了，可点「重新加载」再试。');
      }
    }, 6000);

    var s = document.createElement('script');
    s.src = 'app.js?v=20261023-3d';
    s.onerror = function () { clearTimeout(watchdog); fail('渲染内核 app.js 没加载上'); };
    s.onload = function () {
      booted = true;
      clearTimeout(watchdog);
      if (failed) return; // 已经出过失败卡（例如 WebGL 不可用），别再起内核 UI
      // 情景默认「全开」：进来看的是这套灯装完是什么样，不是演示某个生活场景。
      var want = q.get('preset') || '全开';
      var tries = 0;
      (function pick() {
        var btn = document.querySelector('[data-scene="' + want + '"]');
        if (btn) { btn.click(); return; }
        if (++tries < 80) setTimeout(pick, 50);
      })();

      // 默认进「日景」：没收到设计里的亮灯状态之前，别让整屋压黑（业主第一眼会以为坏了）。
      setMode(false);
      // HUD：改成业主/客户看得懂的一句话；技术参数移到 hover title。
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.id = 'glDemo';
      chip.className = 'gl-mode';
      chip.textContent = '看灯光演示';
      chip.addEventListener('click', function () {
        userMode = true;
        setMode(!nightMode);
        // 用内核自己的回路状态重画一次
        if (window.__viewer) window.__viewer.applyLevels();
      });
      chipEl = chip;
      syncModeUI(false); // hudLine 会把 chipEl 补回 #hud（append 后不会被 innerHTML 冲掉）

      // 3D 家具：内核不画家具，外壳按类型搭；默认开，跟「图层 → 家具」按钮联动。
      furnGroup = buildFurniture();
      initWorldStyle();
      glazeWideDoors();
      applyWorldStyle(nightMode);
      applyFurnitureMode(nightMode);
      setupCeilLine();
      setupFurnitureHover();
      setupLampCard();
      setupLabels();
      (function () {
        var fbtn = document.querySelector('[data-toggle="furniture"]');
        if (!fbtn) return;
        if (!furnGroup) {
          fbtn.disabled = true;
          fbtn.title = '当前楼层没有家具数据';
          fbtn.style.opacity = '.45';
          fbtn.style.cursor = 'default';
        } else {
          fbtn.title = '显示这一层的 ' + furnItems.length + ' 件家具（可开关）';
        }
      })();
      syncLayerButtons();

      // 光束按真实安装高度/半角重算一次，再套昼夜外观；日景默认也要能看见光锥。
      fitBeams();
      applyBeamStyle(nightMode);
      if (window.__viewer.applyLevels) window.__viewer.applyLevels();

      // 相机取景：默认鸟瞰自动适配；用户动过视角之后不再抢镜头。
      (function () {
        var v = window.__viewer;
        if (v.controls && v.controls.addEventListener) {
          v.controls.addEventListener('start', function () {
            viewTouched = true;
            birdView = false;
            cancelTween();
          });
        }
        Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (btn) {
          btn.addEventListener('click', function () {
            var mode = btn.getAttribute('data-view');
            viewTouched = true;
            birdView = mode === 'bird';
            viewMode = mode;
            hideFurnTip();
            if (mode === 'inside') {
              Array.prototype.forEach.call(document.querySelectorAll('#labels .room'), function (el) {
                el.classList.add('lab-hide');
              });
            }
            if (birdView) setTimeout(function () { fitCamera(true); }, 60);
            if (mode === 'inside') setTimeout(insideView, 30);
            // 画布不宽时选完视角先收起面板，别让控件压住刚聚焦的场景。
            if (window.innerWidth <= 980) setPanelOpen(false);
          });
        });
        var resizeTimer = 0;
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            if (birdView) fitCamera(true);
            // 「全屏看」进出时画布宽度突变：没手动开合过面板就跟着宽度重定默认态
            if (!panelTouched) setPanelOpen(window.innerWidth > 980);
          }, 180);
        });
        // 剖切高度变了，可见墙顶跟着变；鸟瞰下重新取景，避免切高后户型缩在画面一角。
        var cutEl = document.getElementById('cut');
        if (cutEl) cutEl.addEventListener('input', function () {
          if (birdView) setTimeout(function () { fitCamera(true); }, 60);
        });
        fitCamera(true);
        setTimeout(function () { if (!viewTouched) fitCamera(true); }, 700);
      })();

      if (q.get('night') === '1') { userMode = true; setMode(true); }

      // 内核面板里的「灯光演示」按钮与 HUD 开关保持同一状态（否则两个入口各切各的）
      var btnLight = document.getElementById('btnLight');
      if (btnLight) {
        btnLight.onclick = function () { userMode = true; setMode(!nightMode); };
      }

      // 控件面板：默认只在够宽的画布里展开。工作台把 3D 嵌成 500~900 px 的窗口，
      // 常驻面板会吃掉右侧三成画面，所以那里默认收起，用右上「视角 / 图层」唤出。
      var tools = document.getElementById('glTools');
      var panel = document.getElementById('panel');
      var closeBtn = document.getElementById('glClose');
      var panelTouched = false;   // 用户手动开合过 → 缩放/全屏时不再替他改
      function setPanelOpen(open) {
        panel.classList.toggle('gl-open', open);
        tools.hidden = open;
        tools.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      tools.addEventListener('click', function () { panelTouched = true; setPanelOpen(true); });
      if (closeBtn) closeBtn.addEventListener('click', function () { panelTouched = true; setPanelOpen(false); });
      document.addEventListener('keydown', function (e) {
        // 全屏时 Esc 是「退出全屏」，别顺手把面板状态记成用户手动改过
        if (e.key === 'Escape' && !document.fullscreenElement && panel.classList.contains('gl-open')) {
          panelTouched = true;
          setPanelOpen(false);
        }
      });
      setPanelOpen(window.innerWidth > 980);

      // 操作提示看过即走
      var hintEl = document.querySelector('.hint');
      if (hintEl) setTimeout(function () { hintEl.classList.add('gl-fade'); }, 7000);

      // 就绪握手：告诉工作台「可以推亮度了」，避免它靠猜时间补发
      post('guanglv:ready', { floor: q.get('floor') || '1' });
      setTimeout(function () { post('guanglv:ready', { floor: q.get('floor') || '1' }); }, 600);

      // 画布可访问性
      var cv = document.querySelector('#app canvas');
      if (cv) {
        cv.setAttribute('role', 'img');
        cv.setAttribute('aria-label', '户型三维灯光场景，可拖动旋转、滚轮缩放');
      }

      // 竖屏全屏手机（iframe 又窄又高，如 390×768）时，内核默认 42° 竖向视场会把左右两侧
      // 房间挤出标签候选窗（实测 390×768 下「主卧」display:none，只剩 8 个标签）。
      // 这里把视场角轻微放宽到 48°，整套户型 + 9 个房间标签就都落在画面内；
      // 儿童房仍在候选窗外（|y|>1.2，P1 不修）。
      (function fitPortraitView() {
        var v = window.__viewer;
        if (v && window.innerWidth < 460 && window.innerHeight > window.innerWidth * 1.5 && v.camera.fov < 48) {
          v.camera.fov = 48;
          v.camera.updateProjectionMatrix();
        }
        window.requestAnimationFrame(fitPortraitView);
      })();
    };
    document.body.appendChild(s);

    // 工作台切情景 / 拖回路亮度时，会把每个回路的 0..1 亮度发过来。
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type !== 'guanglv:levels' || !window.__viewer || !window.__SCENE__) return;
      var levels = d.levels || {};
      var names = (window.__SCENE__.circuits || []).map(function (c) { return c.name; });
      var any = false;
      names.forEach(function (n) {
        var v = levels[n];
        var vv = v === undefined ? 0 : Math.max(0, Math.min(1, Number(v) || 0));
        if (vv > 0.02) any = true;
        window.__viewer.setCircuit(n, vv);
      });
      gotLevels = true;
      // D-04：默认保持日景（进 3D 第一眼必须亮）。「灯光演示」只由用户点开关触发，
      // 不再因为「设计里有灯亮着」自动压暗——否则一进 3D 又回到几乎全黑。
      if (nightMode) hudLine('灯光演示：暗环境看亮灯效果');
    });
  }

  window.addEventListener('error', function (e) {
    var msg = String((e && e.message) || '');
    if (/webgl|context/i.test(msg)) {
      fail('三维需要的 WebGL 初始化失败：' + msg, '三维暂时打不开',
        '可以先用二维平面图继续；换 Chrome / Edge 或打开硬件加速后再试。');
    }
  });

  if (q.get('scene')) {
    fetch(q.get('scene')).then(function (r) { return r.json(); }).then(boot).catch(function (e) { fail(e.message); });
    return;
  }
  var pid = q.get('project');
  if (!pid) { fail('缺 project 参数'); return; }
  var url = '/api/lighting3d/' + encodeURIComponent(pid) + '/ueyi-scene.json?floor=' + (q.get('floor') || '1')
          + (q.get('height') ? '&height=' + q.get('height') : '');
  fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.error) return fail(j.error);
    boot(j);
  }).catch(function (e) { fail(e.message); });
})();
</script>

    padding:6px 8px;border-radius:10px;background:rgba(20,22,26,.82);border:1px solid rgba(255,255,255,.14);
    box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(8px)}

    color:#e8e2d6;font:12px/1.4 -apple-system,"PingFang SC",sans-serif;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}

  html.gvMin #hud,html.gvMin #legend,html.gvMin #fixtures,html.gvMin .hint{display:none!important}

  /* 窄画面：面板默认收起，点「控件」再展开（1.5.0 修 1.4.2 的窄屏常显） */

</style>

  <label class="gvFile" title="导入 .ies 配光文件，按真实半峰值角重算光锥">IES<input id="gvIesFile" type="file" accept=".ies,text/plain"></label>
  <button type="button" data-x="clear" title="还原为初始光锥">还原光锥</button>
  <span id="gvExtStatus" aria-live="polite"></span>
</div>
<div id="gvExtToast" role="status" aria-live="polite"></div>
<script src="ies-ext.js"></script>
<script>
/* V-24 壳交互增量（叠在工作台 1.6.0 上，只做加法，不动渲染与默认观感）
 * 记忆键统一 gv.v24.<project>.<floor>.*：min / night / cone / view / panel / ies + iesName
 *  1) 视角记忆：面板 [data-view] 点过就记（top/bird/inside），下次进三维自动恢复；默认仍是鸟瞰。
 *  2) 面板显隐记忆：用「控件」收起/展开、面板 × 收起、「视角 / 图层」展开时记忆，下次沿用。
 *  3) IES 记忆（可选）：把原始 .ies 文本（≤200KB）存本地，进三维自动重放并提示；「还原光锥」清除记忆。
 *  4) 首次访问仍是原默认：完整 + 日景 + 光锥开 + 面板可见 + 鸟瞰。
 *  5) 昼夜/光锥/精简的记忆与双向同步、M/N/C 快捷键沿用 1.6.0（未重写）；只补「点空白 / Esc 收控件条」的记录。
 */
(function(){
  var bar = document.getElementById('gvExtBar');
  var status = document.getElementById('gvExtStatus');
  var minOn = false, nightOn = false, forced = false;
  var lastNight = null, lastCone = null, lastPanel = null;
  var pollReady = false;   // 就绪前不写记忆：1.6.0 的轮询在 boot 完成前会误判一次状态
  // 1.6.0：偏好按「项目 + 楼层」隔离，避免多项目共用一套记忆；旧键自动迁移
  var US = new URLSearchParams(location.search);
  var PREFIX = 'gv.v24.' + (US.get('project') || 'default') + '.' + (US.get('floor') || '1') + '.';
  var K = {
    min: PREFIX + 'min', night: PREFIX + 'night', cone: PREFIX + 'cone',
    view: PREFIX + 'view', panel: PREFIX + 'panel', ies: PREFIX + 'ies', iesName: PREFIX + 'iesName'
  };
  var K_OLD = { min: 'gv.v24.min', night: 'gv.v24.night', cone: 'gv.v24.cone' };
  var VIEW_NAME = { top: '户型图', bird: '鸟瞰', inside: '室内视角' };
  var IES_MAX = 200000;   // 单份 .ies 文本上限（字符）：超出就不记忆，避免占满 localStorage
  /* ===== 1.10.0 夜景皮肤：参考优邑的墙/地/家具/灯具表现形式 + IES 窄光束 ===== */
  var NIGHT_IES_TEXT = "IESNA:LM-63-2002\n[TEST] narrow 10deg\nTILT=NONE\n1 800 1 5 1 1 1 0 0 0\n0 5 10 15 20\n0\n1000 900 500 120 0\n";
  var SKIN = { on: false, saved: [], lights: [], blocks: null, autoIes: false };
  var userIes = false;
  function skinSave(v) {
    var T = v.THREE, groups = v.groups || {};
    skinSave.group = function(key, floor) {
      var g = groups[key]; if (!g) return;
      g.traverse(function (o) {
        if (!o.isMesh || !o.material || !o.material.color) return;
        var m = o.material;
        SKIN.saved.push({ mat: m, color: m.color.getHex(), floor: !!floor });
      });
    };
    skinSave.group('wall', false); skinSave.group('floor', true); skinSave.group('open', false);
  }
  function skinBlocks(v) {
    var T = v.THREE, old = (v.groups || {}).furniture;
    if (!old || !old.children.length) return;
    var g = new T.Group(); g.name = 'gvUyiBlocks';
    var palette = ['#A9825A', '#B89772', '#9A9284', '#8D9198'];
    old.children.forEach(function (c, idx) {
      var b = new T.Box3().setFromObject(c);
      var size = b.getSize(new T.Vector3()), ctr = b.getCenter(new T.Vector3());
      var w = Math.max(0.35, Math.min(0.75, (size.x || 0.6) * 0.85));
      var d = Math.max(0.35, Math.min(0.75, (size.z || 0.6) * 0.85));
      var h = Math.max(0.38, Math.min(0.8, (size.y || 0.5) * 0.6));
      var mesh = new T.Mesh(new T.BoxGeometry(w, h, d),
        new T.MeshStandardMaterial({ color: palette[idx % palette.length], roughness: 0.88 }));
      mesh.position.set(ctr.x, h / 2 + 0.02, ctr.z);
      g.add(mesh);
    });
    old.visible = false;
    v.scene.add(g);
    SKIN.blocks = g;
  }
  function skinLights(v) {
    var g = (v.groups || {}).light; if (!g) return;
    g.traverse(function (o) {
      if (o.isMesh && o.material) {
        var m = o.material;
        SKIN.lights.push({ mat: m, color: m.color ? m.color.getHex() : null });
        if (m.color) m.color.set('#fff1d0');
        if (m.emissive) { m.emissive.set('#ffd479'); m.emissiveIntensity = 0.55; }
      }
    });
  }
  function applySkin(on) {
    var v = window.__viewer; if (!v || !v.THREE) return;
    if (on === SKIN.on) return;
    SKIN.on = !!on;
    var i;
    if (on) {
      if (!SKIN.saved.length) skinSave(v);
      for (i = 0; i < SKIN.saved.length; i += 1) {
        var r = SKIN.saved[i]; if (r.mat.color) r.mat.color.set(r.floor ? '#cbb08c' : '#f0e8da');
      }
      skinBlocks(v);
      skinLights(v);
      if (!userIes && window.GVIes) {
        try { window.GVIes.apply(window, window.GVIes.parse(NIGHT_IES_TEXT)); SKIN.autoIes = true; } catch (e) {}
      }
    } else {
      for (i = 0; i < SKIN.saved.length; i += 1) { var q = SKIN.saved[i]; if (q.mat.color && q.color !== null) q.mat.color.set(q.color); }
      if (SKIN.blocks) { v.scene.remove(SKIN.blocks); SKIN.blocks = null; }
      var furn = (v.groups || {}).furniture; if (furn) furn.visible = true;
      for (i = 0; i < SKIN.lights.length; i += 1) {
        var l = SKIN.lights[i]; if (l.color !== null && l.mat.color) l.mat.color.set(l.color);
        if (l.mat.emissive) l.mat.emissiveIntensity = 0;
      }
      if (SKIN.autoIes && window.GVIes) { window.GVIes.clear(window); SKIN.autoIes = false; }
    }
    try { v.renderer.render(v.scene, v.camera); } catch (e) {}
  }

  var toastEl = document.getElementById('gvExtToast'), toastTimer = null;
  function say(t){
    if (status) status.textContent = t || '';
    if (!toastEl) return;
    if (t) {
      toastEl.textContent = t;
      toastEl.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 3200);
    } else {
      toastEl.classList.remove('on');
    }
  }
  function whenReady(cb){ var t0 = Date.now(); (function tick(){ if (window.__ready && window.__viewer) return cb(); if (Date.now()-t0>20000) return; setTimeout(tick,120); })(); }
  function lsRead(k){
    try { var v = localStorage.getItem(k); return v === '1' ? true : (v === '0' ? false : null); }
    catch (e) { return null; }   // 隐私模式 / 存储被禁用：静默降级为「不记忆」
  }
  function lsGet(k, old){
    var v = lsRead(k);
    if (v === null && old) { v = lsRead(old); if (v !== null) lsSet(k, v); }   // 旧键迁移
    return v;
  }
  function lsSet(k, on){
    try { localStorage.setItem(k, on ? '1' : '0'); } catch (e) {}
  }
  function lsGetStr(k){
    try { return localStorage.getItem(k) || null; } catch (e) { return null; }
  }
  function lsSetStr(k, v){
    try { localStorage.setItem(k, String(v)); } catch (e) {}
  }
  function lsRemove(k){
    try { localStorage.removeItem(k); } catch (e) {}
  }
  function setMin(on, opts){
    opts = opts || {};
    minOn = !!on;
    document.documentElement.classList.toggle('gvMin', minOn);
    bar.querySelector('[data-x="min"]').classList.toggle('on', minOn);
    if (!minOn) forced = false;
    var panel = document.getElementById('panel');
    if (panel) panel.classList.remove('gvForce');
    if (opts.paint !== false) paint();
    if (opts.persist !== false) lsSet(K.min, minOn);
  }
  function lightBtn(){ return document.getElementById('btnLight'); }
  function lightState(){ var b = lightBtn(); return b ? b.classList.contains('on') : false; }
  function setNight(on, opts){
    opts = opts || {};
    var b = lightBtn();
    // N2 修复（1.4.2）：必须走壳层自己的「灯光演示」按钮，否则墙面/家具材质与 HUD 状态不同步
    if (b) { if (b.classList.contains('on') !== !!on) b.click(); }
    nightOn = lightState();            // 以点完之后的真实状态为准（按钮不存在 / 点击失败时不虚报）
    bar.querySelector('[data-x="night"]').classList.toggle('on', nightOn);
    lastNight = nightOn;
    // 1.9.0：日夜=两套三维表现形式 —— 白天=空间渲染（完整控件）/ 夜晚=参考三维态（精简界面）
    if (opts.ui !== false) setMin(nightOn, { persist: opts.persist });
    applySkin(nightOn);
    if (opts.persist !== false) lsSet(K.night, nightOn);
    if (opts.quiet !== true) say(nightOn ? '夜景：参考三维态（精简）' : '日景：空间渲染（完整）');
  }
  bar.querySelector('[data-x="min"]').onclick = function(){ setMin(!minOn); autoBar(); say(minOn ? '精简：只留空间名' : '完整：显示全部控件'); };
  bar.querySelector('[data-x="night"]').onclick = function(){ setNight(!nightOn); };
  function coneBtn(){ return document.querySelector('[data-toggle="beams"]'); }
  function coneState(){
    var g = window.__viewer && window.__viewer.groups && window.__viewer.groups.beams;
    if (g && typeof g.visible === 'boolean') return g.visible;   // 内核真实可见性优先（点击面板后立即可读）
    var b = coneBtn(); return b ? b.classList.contains('on') : true;
  }
  function setCone(on, opts){
    opts = opts || {};
    var b = coneBtn();
    if (b) { if (b.classList.contains('on') !== !!on) b.click(); }
    var cur = coneState();
    bar.querySelector('[data-x="cone"]').classList.toggle('on', cur);
    lastCone = cur;
    if (opts.persist !== false) lsSet(K.cone, cur);
    if (opts.quiet !== true) say(cur ? '光锥：开' : '光锥：关');
  }
  bar.querySelector('[data-x="cone"]').onclick = function(){ setCone(!coneState()); };
  function autoBar(){
    if (bar.classList.contains('gvOpen')) return;
    bar.classList.remove('gvCompact');
    bar.style.marginLeft = '';
    var br = bar.getBoundingClientRect();
    function oxOf(el){
      if (!el) return 0;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') return 0;
      var r = el.getBoundingClientRect();
      var ox = Math.min(br.right, r.right) - Math.max(br.left, r.left);
      var oy = Math.min(br.bottom, r.bottom) - Math.max(br.top, r.top);
      return (ox > 0 && oy > 0) ? ox : 0;
    }
    // 审计 1.6.0 P3：默认不压面板/HUD；只要有一点点重叠就收成「⋯」。
    // （「⋯」贴右只有 50px，不会碰到左上 HUD，也不会碰到右侧面板。）
    var p = panelEl();
    var hudOx = oxOf(document.getElementById('hud'));
    var panelOx = (p && getComputedStyle(p).display !== 'none') ? oxOf(p) : 0;
    if (hudOx > 0 || panelOx > 4 || window.innerWidth < 900) {
      bar.style.marginLeft = '';
      bar.classList.add('gvCompact');
    }
  }
  window.__gvAutoBar = autoBar;   // QA/自测入口（不影响行为）
  bar.querySelector('[data-x="more"]').onclick = function(){
    bar.classList.toggle('gvOpen');
    if (!bar.classList.contains('gvOpen')) autoBar();
    say(bar.classList.contains('gvOpen') ? '控件条已展开' : '');
  };
  // 面板打开时收起「视角/图层」按钮，避免压住面板 ×（窄画面）
  function syncTools(){
    var p = panelEl(); var g = document.getElementById('glTools');
    if (!p || !g) return;
    var open = getComputedStyle(p).display !== 'none';
    // 1.6.0 原来只改 style.display，.gl-tools[hidden]{display:none!important} 仍会压住它；
    // 面板收起时把 hidden 也一起清掉，「视角 / 图层」才真的能点（面板记忆收起后不会没入口）。
    g.hidden = open;
    g.style.display = open ? 'none' : '';
  }
  addEventListener('resize', autoBar);
  function panelEl(){ return document.getElementById('panel'); }
  function panelShown(){
    var p = panelEl(); if (!p) return false;
    var cs = getComputedStyle(p);
    return cs.display !== 'none';
  }
  function setPanelVisible(show, opts){
    opts = opts || {};
    var p = panelEl(); if (!p) return;
    p.classList.toggle('gvHide', !show);
    p.classList.toggle('gvForce', !!show);
    if (opts.quiet !== true) say(show ? '控件已展开' : '控件已收起');
    syncTools();
  }
  /* ===== V-24 本轮增量 A：面板显隐记忆（只记用户主动开合，不记窗口 resize 的自动开合） ===== */
  function notePanel(force){
    var s = panelShown();
    if (!force && s === lastPanel) return;
    lastPanel = s;
    lsSet(K.panel, s);
  }
  function userOpenPanel(){
    var p = panelEl();
    if (p) { p.classList.remove('gvHide'); p.classList.add('gvForce'); }
    syncTools(); notePanel(true);
  }
  function userClosePanel(){
    // 面板可能是被「控件」用 gvForce 打开的（此时外壳 × 只移除 gl-open，面板不会真的消失），
    // 这里把 gvForce 一起去掉并落 gvHide，保证「× 关得掉、下次也还是关着」。
    var p = panelEl();
    if (p) { p.classList.remove('gvForce'); p.classList.add('gvHide'); }
    syncTools(); notePanel(true);
  }
  bar.querySelector('[data-x="panel"]').onclick = function(){
    setPanelVisible(!panelShown(), { quiet: false });
    notePanel(true);
  };

  /* ===== V-24 本轮增量 B：视角记忆（面板里的户型图 / 鸟瞰 / 室内视角） ===== */
  function hookViews(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (btn) {
      if (btn.__v24view) return;              // 不重复绑定
      btn.__v24view = true;
      btn.addEventListener('click', function () {
        var m = btn.getAttribute('data-view');
        if (VIEW_NAME[m]) lsSetStr(K.view, m);
      });
    });
  }
  function applyView(mode){
    // 默认就是鸟瞰，bird 不需要点；只有 top/inside 才恢复
    if (!mode || mode === 'bird' || !VIEW_NAME[mode]) return false;
    var btn = document.querySelector('[data-view="' + mode + '"]');
    if (!btn) return false;
    try { btn.click(); return true; } catch (e) { return false; }
  }

  /* ===== V-24 本轮增量 C：IES 配光记忆（原始文本，进三维自动重放；还原光锥清除） ===== */
  function saveIes(name, text){
    if (!text || text.length > IES_MAX) { lsRemove(K.ies); lsRemove(K.iesName); return false; }
    lsSetStr(K.ies, text);
    lsSetStr(K.iesName, name || '');
    return true;
  }
  function clearIes(){ lsRemove(K.ies); lsRemove(K.iesName); }
  function restoreIes(){
    var text = lsGetStr(K.ies);
    if (!text || !window.GVIes) return null;
    try {
      var parsed = window.GVIes.parse(text);
      var res = window.GVIes.apply(window, parsed);
      userIes = true;      // 用户记忆的 IES 优先，夜景皮肤不再自动套窄光束
      return { name: lsGetStr(K.iesName) || '上次 IES', half: parsed.halfAngleDeg, applied: res.applied };
    } catch (e) {
      clearIes();          // 记忆过期 / 场景换过导致应用失败：清掉，别每次进都报错
      return null;
    }
  }

  /* ===== 1.6.0 增量：控件条 ↔ 面板双向同步（一个轮询，不重复绑事件） ===== */
  function paint(){
    var n = lightState(), c = coneState();
    nightOn = n;
    var nb = bar.querySelector('[data-x="night"]'), cb = bar.querySelector('[data-x="cone"]'), mb = bar.querySelector('[data-x="min"]');
    if (nb) nb.classList.toggle('on', n);
    if (cb) cb.classList.toggle('on', c);
    if (mb) mb.classList.toggle('on', minOn);
    return { night: n, cone: c };
  }
  var layoutTick = 0;
  setInterval(function(){
    syncTools();
    if (++layoutTick % 5 === 0) autoBar();   // HUD/面板尺寸晚到也会被纠正（审计 P3）
    if (!pollReady) return;
    var n = lightState(), c = coneState();
    var changed = false;
    if (n !== lastNight) {
      lastNight = n;
      lsSet(K.night, n);
      say(n ? '夜景：面板已切到灯光演示' : '日景：面板已切回日景');
      changed = true;
    }
    if (c !== lastCone) {
      lastCone = c;
      lsSet(K.cone, c);
      say(c ? '光锥：开' : '光锥：关');
      changed = true;
    }
    if (changed) paint();
  }, 400);

  /* ===== 1.6.0 增量：快捷键 M / N / C（打字时不抢键） + 展开态点空白/Esc 收起 ===== */
  function typing(e){
    var t = e.target;
    if (!t || t === document || t === window || t.nodeType !== 1) return false;
    var tag = (t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
    if (t.isContentEditable) return true;
    return false;
  }
  function hotkey(k){
    if (k === 'escape') {
      if (bar.classList.contains('gvOpen')) { bar.classList.remove('gvOpen'); autoBar(); }
      return false;              // 不拦截 Esc：外壳还要用它收面板 / 退全屏
    }
    if (k === 'm') { setMin(!minOn); autoBar(); say(minOn ? '精简：只留空间名' : '完整：显示全部控件'); return true; }
    if (k === 'n') { setNight(!nightOn); return true; }
    if (k === 'c') { setCone(!coneState()); return true; }
    return false;
  }
  document.addEventListener('keydown', function(e){
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || e.isComposing || e.keyCode === 229) return;
    if (typing(e)) return;
    var k = String(e.key || '').toLowerCase();
    if (hotkey(k)) e.preventDefault();
    if (k === 'escape') setTimeout(function(){ notePanel(); }, 0);   // 外壳的 Esc 先收面板，这里只记结果
  });
  // 1.6.0：外层页面把 M/N/C 转发进来（焦点不在三维画面时也能用）
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin) return;
    var d = e.data || {};
    if (d.type === 'guanglv:v24key' && hotkey(String(d.key || '').toLowerCase())) { /* handled */ }
  });
  document.addEventListener('pointerdown', function(e){
    if (!bar.classList.contains('gvOpen')) return;
    if (!bar.contains(e.target)) { bar.classList.remove('gvOpen'); autoBar(); }
  }, true);

  bar.querySelector('[data-x="clear"]').onclick = function(){
    try {
      if (window.GVIes) {
        window.GVIes.clear(window);
        clearIes();
        say('已还原光锥');
      }
    } catch(e){ say('还原失败：' + (e.message||e)); }
  };
  var file = document.getElementById('gvIesFile');
  file.addEventListener('change', function(){
    var f = file.files && file.files[0]; if (!f) return;
    f.text().then(function(text){
      try {
        var parsed = window.GVIes.parse(text);
        userIes = true;
        var res = window.GVIes.apply(window, parsed);
        saveIes(f.name, text);
        say('IES：' + f.name + ' · 半峰 ' + parsed.halfAngleDeg.toFixed(1) + '° · ' + res.applied + ' 盏');
      } catch(e){ say('IES 解析失败：' + (e.message||e)); }
    });
  });

  /* ===== 状态记忆（首次访问 = 原默认；有记忆才恢复） ===== */
  var savedMin = lsGet(K.min, K_OLD.min), savedNight = lsGet(K.night, K_OLD.night), savedCone = lsGet(K.cone, K_OLD.cone);
  var savedView = lsGetStr(K.view), savedPanel = lsGet(K.panel);
  if (savedMin === true) setMin(true, { persist: false, paint: false });  // 先上 class，避免加载中闪一下完整界面
  // 面板「上次是收起」的话先挂 gvHide，避免刷新时面板先亮一下再消失
  if (savedPanel === false && panelEl()) panelEl().classList.add('gvHide');

  whenReady(function(){
    try { if (window.GVIes) window.GVIes.init(window); } catch(e){}
    var restored = [];
    setMin(savedMin === null ? true : savedMin === true, { persist: false });
    if (savedMin === true) restored.push('精简');
    // URL 显式带 night= 时以 URL 为准（深链 / 工作台推送），不覆盖
    if (!/[?&]night=/.test(location.search)) {
      setNight(savedNight === null ? true : savedNight === true, { persist: false, quiet: true, ui: false });
      if (savedNight === true) restored.push('夜景');
    }
    setCone(savedCone === null ? coneState() : savedCone, { persist: false, quiet: true });
    if (savedCone === true) restored.push('光锥开');
    if (savedCone === false) restored.push('光锥关');
    // 视角要在 boot 的 700ms 自动取景之前点（点完 viewTouched=true，取景不会再抢镜头）
    if (applyView(savedView)) restored.push('视角：' + VIEW_NAME[savedView]);
    // 面板在视角之后恢复：窄屏点视角会顺手收起面板，以记忆为准
    if (savedPanel !== null && panelShown() !== savedPanel) {
      setPanelVisible(savedPanel, { quiet: true });
      restored.push(savedPanel ? '面板展开' : '面板收起');
    } else if (savedPanel === false) {
      restored.push('面板收起');   // 解析期已经挂好 gvHide，不需要再动，但状态里要说清
    }
    var ies = restoreIes();
    if (ies) restored.push('已恢复上次 IES：' + ies.name);
    paint();
    lastNight = lightState(); lastCone = coneState(); lastPanel = panelShown();
    pollReady = true;
    autoBar(); syncTools();
    if (nightOn) applySkin(true);
    hookViews();
    var closeBtn = document.getElementById('glClose');
    if (closeBtn) closeBtn.addEventListener('click', function(){ setTimeout(userClosePanel, 0); });
    var tools = document.getElementById('glTools');
    if (tools) tools.addEventListener('click', function(){
      var p = panelEl(); if (p) p.classList.remove('gvHide');
      setTimeout(function(){ syncTools(); notePanel(); }, 0);
    });
    say(restored.length ? '场景已就绪 · 已恢复上次状态（' + restored.join(' · ') + '）' : '场景已就绪');
  });
})();
</script>

</html>
